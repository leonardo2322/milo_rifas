server {
    listen 80;
    
    # Configuración para servir archivos estáticos
    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 30d;
    }

    # Configuración para servir archivos media
    location /media/ {
        alias /usr/share/nginx/html/media/;
        expires 30d;
    }

    # Configuración para pasar peticiones de Django a Gunicorn o Django directamente
    location / {
        proxy_pass http://<IP_DE_TU_SERVIDOR_DJANGO>:8000;  # Cambia esta IP por la dirección de tu servidor Django
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
